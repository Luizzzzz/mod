name: Build and release mod

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        default: v1.0.10
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Package script mod
        run: |
          mkdir -p build/release
          zip -r build/release/CheatBridge.zip mod.hjson scripts bundles sprites
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" build/release/CheatBridge.zip --verify-tag --title "Cheat Bridge [v161]" --generate-notes
