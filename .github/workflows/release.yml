name: Build and release mod

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish
        required: true
        default: v1.0.16
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - name: Package script mod
        run: |
          mkdir -p build/release
          zip -r build/release/CheatBridge.zip mod.hjson scripts bundles sprites
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              if gh release upload "$RELEASE_TAG" build/release/CheatBridge.zip --clobber; then
                exit 0
              fi
            elif gh release create "$RELEASE_TAG" build/release/CheatBridge.zip --verify-tag --title "Cheat Bridge [$RELEASE_TAG]" --generate-notes; then
              exit 0
            fi

            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 10))
            fi
          done

          echo "Failed to publish release $RELEASE_TAG after 5 attempts." >&2
          exit 1
